deploy_info:
  private_submodules:
    - git@github.com:ampsoftwaresl/asoo-tools.git
    - git@github.com:ampsoftwaresl/server-tools.git

server_setup:
  update:
    sudo: true
    commands:
      - 'apt update'
  git:
    sudo: true
    commands:
      - 'apt -y install git'
  curl:
    sudo: true
    commands:
      - 'apt -y install curl'
  swift:
    sudo: true
    commands:
      - 'apt -y install python3-swiftclient'
  docker:
    sudo: true
    commands:
      - 'apt update'
      - 'apt install -y ca-certificates curl gnupg'
      - 'install -m 0755 -d /etc/apt/keyrings'
      - 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.gpg'
      - 'chmod a+r /etc/apt/keyrings/docker.gpg'
      - 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list'
      - 'apt update'
      - 'apt install -y docker-ce=5:28.5.2-1~ubuntu.22.04~jammy docker-ce-cli=5:28.5.2-1~ubuntu.22.04~jammy containerd.io'  
  docker-compose:
    sudo: true
    commands:
      - 'curl -L https://github.com/docker/compose/releases/download/1.24.1/docker-compose-`uname -s`-`uname -m` -o /usr/local/bin/docker-compose'
      - 'chmod +x /usr/local/bin/docker-compose'
  workspace-chmod:
    sudo: true
    commands:
      - 'chmod 757 /opt/'

environment_info:
  application: 'odoo'
  application_version: '18.0'
  application_service: 'web'
  application_container_user: '0'
  git_submodule_path: 'addons'
  addons_dir: '/mnt'
  nginx_service: 'web'
  nginx_virtual_port: '8069'
  odoo_config: 'config/odoo.conf'
  workspace: '/opt/${object.server_id.technical_name}-${object.name}-${object.id}'
  process_files:
    - 'docker-compose.yml'
    - 'config/odoo.conf'
    - 'config/odoo-test.conf'
  rebuild_files:
    - 'Dockerfile'
    - 'requirements.txt'
    - 'docker-compose.yml'

environment_setup:
  entrypoint_chmod:
    commands:
      - 'chmod 655 entrypoint.sh'

environment_test_info:
  test_mute: true
  test_error_regex: '^(?:\d{4}-\d\d-\d\d \d\d:\d\d:\d\d,\d{3} \d+ (?:ERROR|CRITICAL) )|(?:Traceback \(most recent call last\):)$'
  test_warn_regex: '^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d,\d{3} \d+ WARNING '
  script_test:
    service: 'web'
    commands:
      - 'odoo --test-enable -c /etc/odoo/odoo-test.conf --log-level=test --stop-after-init -i base'
  script_after:
    sudo: true
    commands:
      - 'docker-compose stop web'
      - 'docker-compose exec -T db dropdb -U odoo odoo-test'
      - 'docker-compose start web'
